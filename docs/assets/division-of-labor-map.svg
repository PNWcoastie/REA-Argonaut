  </text>
  <text x="934" y="428" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Scaffolds pure Cargo crate (Cargo.toml + tests)
  </text>
  <text x="934" y="450" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    → Verified by cargo test on disk
  </text>

  <!-- Self-Healing Feedback Loop Arrow (Stage 3 back to Stage 2) -->
  <path d="M 1092 490 L 1092 536 L 660 536 L 660 496" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="696" y="520" width="360" height="30" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="876" y="539" text-anchor="middle" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    Self-Healing Counterexample Loop (if diverged)
  </text>
</svg>
