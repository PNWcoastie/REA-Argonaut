<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stage1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="1200" height="560" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header Banner -->
  <text x="40" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">
    REA-Argonaut (ArgonZeroG) — Who Does What? The 3-Stage Division of Labor Map
  </text>
  <text x="40" y="72" fill="#94A3B8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">
    How deterministic binary extraction, Gemini 4 Argon reasoning, and sandboxed mathematical verification work together without blind guessing
  </text>

  <!-- ==================== STAGE 1: THE X-RAY ==================== -->
  <rect x="36" y="96" width="348" height="390" rx="14" fill="url(#stage1Grad)" stroke="#38BDF8" stroke-width="2"/>
  <rect x="54" y="114" width="136" height="26" rx="13" fill="#0369A1"/>
  <text x="122" y="132" text-anchor="middle" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    STAGE 1 • THE X-RAY
  </text>
  <text x="200" y="132" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">
    0% AI Guessing
  </text>

  <text x="54" y="164" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">
    Deterministic Tool Extraction
  </text>
  <text x="54" y="184" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Owner: REA-Argonaut MCP Server / CLI
  </text>

  <!-- Step 1A Box -->
  <rect x="54" y="200" width="312" height="118" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="68" y="222" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">
    1A. export_recon_kit (Static X-Ray)
  </text>
  <text x="68" y="242" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Auto-detects Mounts 1–4 in ~1 second
  </text>
  <text x="68" y="260" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Clusters C++/Rust classes, UI views, MMIO, AI
  </text>
  <text x="68" y="278" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Writes RECON_BLUEPRINT.md + recon-kit/
  </text>
  <text x="68" y="298" fill="#7DD3FC" font-family="monospace" font-size="12">
    -&gt; 0 unsolicited HTML files by default
  </text>

  <!-- Step 1B Box -->
  <rect x="54" y="330" width="312" height="138" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="68" y="352" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">
    1B. decompile_subgraph (Deep Call Graph)
  </text>
  <text x="68" y="372" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Tier-1 Ghidra 12.x or Tier-2 Zero-Install
  </text>
  <text x="68" y="390" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Extracts up to 50 connected functions in 1 call
  </text>
  <text x="68" y="408" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Recovers P-Code struct field offsets (this+0x14)
  </text>
  <text x="68" y="426" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Pre-flags binary hazards (IDIV, overflow, sinks)
  </text>
  <text x="68" y="448" fill="#7DD3FC" font-family="monospace" font-size="12">
    -&gt; Replaces 18 micro-pages with 1 turn
  </text>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="384" y1="285" x2="420" y2="285" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowCyan)"/>

  <!-- ==================== STAGE 2: THE ARCHITECT ==================== -->
  <rect x="426" y="96" width="348" height="390" rx="14" fill="url(#stage2Grad)" stroke="#818CF8" stroke-width="2"/>
  <rect x="444" y="114" width="168" height="26" rx="13" fill="#4338CA"/>
  <text x="528" y="132" text-anchor="middle" fill="#E0E7FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    STAGE 2 • THE ARCHITECT
  </text>
  <text x="624" y="132" fill="#A5B4FC" font-family="monospace" font-size="12" font-weight="700">
    1M Context Cache
  </text>

  <text x="444" y="164" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">
    Human Choice + AI Synthesis
  </text>
  <text x="444" y="184" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Owner: Antigravity 2.0 + Gemini 4 Argon Swarm
  </text>

  <!-- Step 2A Box -->
  <rect x="444" y="200" width="312" height="118" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
  <text x="458" y="222" fill="#A5B4FC" font-family="monospace" font-size="13" font-weight="700">
    2A. Native ask_question Decision Modal
  </text>
  <text x="458" y="242" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • You pick which Subsystem to target
  </text>
  <text x="458" y="260" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • You pick 1 of the 4 Engineering Harnesses:
  </text>
  <text x="458" y="278" fill="#C7D2FE" font-family="monospace" font-size="12">
    [1] Safe Rust  [2] Clean UI  [3] HAL  [4] Audit
  </text>
  <text x="458" y="298" fill="#A5B4FC" font-family="monospace" font-size="12">
    • Optional: Opt-in UI Concept Mock (generative_ui)
  </text>

  <!-- Step 2B Box -->
  <rect x="444" y="330" width="312" height="138" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
  <text x="458" y="352" fill="#A5B4FC" font-family="monospace" font-size="13" font-weight="700">
    2B. Clean-Room Code Reconstruction
  </text>
  <text x="458" y="372" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Reads recon-kit/ types &amp; cached subgraph
  </text>
  <text x="458" y="390" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Eliminates every flagged binary hazard
  </text>
  <text x="458" y="408" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Synthesizes #![forbid(unsafe_code)] Safe Rust
  </text>
  <text x="458" y="426" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Or rebuilds modern TypeScript / Web UI views
  </text>
  <text x="458" y="448" fill="#C7D2FE" font-family="monospace" font-size="12">
    -&gt; Zero raw pointers, zero unsafe blocks
  </text>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <line x1="774" y1="285" x2="810" y2="285" stroke="#818CF8" stroke-width="3" marker-end="url(#arrowIndigo)"/>

  <!-- ==================== STAGE 3: THE REFEREE ==================== -->
  <rect x="816" y="96" width="348" height="390" rx="14" fill="url(#stage3Grad)" stroke="#34D399" stroke-width="2"/>
  <rect x="834" y="114" width="162" height="26" rx="13" fill="#047857"/>
  <text x="915" y="132" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    STAGE 3 • THE REFEREE
  </text>
  <text x="1008" y="132" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">
    0% Blind Trust
  </text>

  <text x="834" y="164" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">
    Sandboxed Parity Crucible
  </text>
  <text x="834" y="184" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Owner: verify_rust_parity (Tool Referee)
  </text>

  <!-- Step 3A Box -->
  <rect x="834" y="200" width="312" height="118" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="848" y="222" fill="#34D399" font-family="monospace" font-size="13" font-weight="700">
    3A. 10,064-Vector Differential Fuzzer
  </text>
  <text x="848" y="242" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Loads original binary (.so/.dylib/.dll) in sandbox
  </text>
  <text x="848" y="260" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Runs 10,000 SplitMix64 + 64 boundary inputs
  </text>
  <text x="848" y="278" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Compares C Oracle vs. Safe Rust bit-for-bit
  </text>
  <text x="848" y="298" fill="#6EE7B7" font-family="monospace" font-size="12">
    • Benchmarks native speedup (e.g. 2.12x vs C)
  </text>

  <!-- Step 3B Box -->
  <rect x="834" y="330" width="312" height="138" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="848" y="352" fill="#34D399" font-family="monospace" font-size="13" font-weight="700">
    3B. Self-Healing Shrinker &amp; Pure Crate
  </text>
  <text x="848" y="372" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • If even 1 bit differs: binary-search shrinker
  </text>
  <text x="848" y="390" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      isolates the smallest failing input
  </text>
  <text x="848" y="408" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Loops back to Stage 2 until 100% bit-exact
  </text>
  <text x="848" y="426" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    • Scaffolds pure Cargo crate (Cargo.toml + tests)
  </text>
  <text x="848" y="448" fill="#6EE7B7" font-family="monospace" font-size="12">
    -&gt; Verified by `cargo test` on disk
  </text>

  <!-- Self-Healing Feedback Loop Arrow (Stage 3 back to Stage 2) -->
  <path d="M 990 486 L 990 526 L 600 526 L 600 492" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="650" y="510" width="290" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="795" y="528" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="12" font-weight="700">
    Self-Healing Counterexample Loop (if diverged)
  </text>
</svg>
