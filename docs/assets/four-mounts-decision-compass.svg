  </text>

  <line x1="830" y1="544" x2="868" y2="544" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="875" y="492" width="365" height="104" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
  <text x="893" y="518" fill="#FB7185" font-family="system-ui, sans-serif" font-size="14" font-weight="800">
    Pick Harness 4: Security &amp; Hazard Audit
  </text>
  <text x="893" y="540" fill="#E2E8F0" font-family="monospace" font-size="12">
