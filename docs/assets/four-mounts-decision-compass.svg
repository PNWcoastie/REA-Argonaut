  </text>

  <line x1="830" y1="422" x2="868" y2="422" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="875" y="368" width="365" height="108" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="893" y="394" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="14" font-weight="800">
