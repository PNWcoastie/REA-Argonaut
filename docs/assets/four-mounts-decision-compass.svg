  </text>
  <text x="482" y="206" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">
    • Entrypoint C code (primary_entrypoints.c)
  </text>

  <line x1="830" y1="174" x2="868" y2="174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="875" y="120" width="365" height="108" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="893" y="146" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">
    Pick Harness 1: Verified Safe Rust Port
  </text>
  <text x="893" y="168" fill="#E2E8F0" font-family="monospace" font-size="12">
    id: "verified-safe-rust-port"
  </text>
  <text x="893" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    Rewrites legacy C/C++ logic into crash-proof Rust
  </text>
  <text x="893" y="208" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12">
    + proves 10,000-input parity automatically.
  </text>

  <!-- ==================== ROW 2: MOUNT 2 ==================== -->
  <rect x="40" y="244" width="380" height="108" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
  <text x="58" y="270" fill="#818CF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
