  </text>
  <text x="58" y="580" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    embedded system prompts, or SQLite data stores."
  </text>

  <line x1="420" y1="544" x2="458" y2="544" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="465" y="492" width="365" height="104" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="482" y="518" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">
