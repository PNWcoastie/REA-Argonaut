  </text>

  <line x1="830" y1="298" x2="868" y2="298" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="875" y="244" width="365" height="108" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
  <text x="893" y="270" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="14" font-weight="800">
