<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" fill="none">
  <defs>
    <linearGradient id="bgCompass" x1="0" y1="0" x2="1280" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1280" height="620" rx="18" fill="url(#bgCompass)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="800">
    The Vibe-Coder &amp; Beginner Decoder Ring — 4 Mounts -&gt; ask_question -&gt; 4 Harnesses
  </text>
  <text x="40" y="68" fill="#94A3B8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    Drop any file into export_recon_kit. You don't need to know file formats—here is what each Mount and Harness means in plain English.
  </text>

  <!-- Column Headers -->
  <text x="40" y="104" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
    1. WHAT FILE DID YOU DROP IN? (THE 4 MOUNTS)
  </text>
  <text x="465" y="104" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
    2. WHAT DOES export_recon_kit EXTRACT?
  </text>
  <text x="875" y="104" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
    3. WHICH HARNESS DO YOU CLICK IN ask_question?
  </text>

  <!-- ==================== ROW 1: MOUNT 1 ==================== -->
  <rect x="40" y="120" width="380" height="108" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="58" y="146" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
    Mount 1: Native Apps, Games &amp; Libraries
  </text>
  <text x="58" y="168" fill="#E2E8F0" font-family="monospace" font-size="12">
    .exe  .dll  .so  .dylib  .elf  .wasm
  </text>
  <text x="58" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    "Compiled C, C++, Rust, Go, or .NET programs where
  </text>
  <text x="58" y="208" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    the original source code is gone or stripped."
  </text>

  <line x1="420" y1="174" x2="458" y2="174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="465" y="120" width="365" height="108" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="482" y="146" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">
    types/recovered_types.rs &amp; .h
  </text>
  <text x="482" y="166" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">
