  </text>

  <!-- ==================== ROW 4: MOUNT 4 ==================== -->
  <rect x="40" y="492" width="380" height="104" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
  <text x="58" y="518" fill="#FB7185" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
