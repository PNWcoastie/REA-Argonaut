  </text>
  <text x="893" y="332" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12">
    + can render a visual UI concept preview first!
  </text>

  <!-- ==================== ROW 3: MOUNT 3 ==================== -->
  <rect x="40" y="368" width="380" height="108" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="58" y="394" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
