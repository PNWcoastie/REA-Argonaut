  </text>
  <text x="58" y="332" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    PyInstaller bundles, or Android apps with UI."
  </text>

  <line x1="420" y1="298" x2="458" y2="298" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="465" y="244" width="365" height="108" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="482" y="270" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">
    ui-preview/ui_inventory.json
  </text>
  <text x="482" y="290" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">
