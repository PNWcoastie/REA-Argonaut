  </text>
  <text x="58" y="456" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    firmware images, or Wireshark/Sigrok captures."
  </text>

  <line x1="420" y1="422" x2="458" y2="422" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="465" y="368" width="365" height="108" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="482" y="394" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">
