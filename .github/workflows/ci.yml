name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check plugin bundle sync
        run: node scripts/sync-plugin-bundle.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run targeted tests
        run: npx vitest run --no-file-parallelism src/contracts/antigravityCompliance.test.ts src/native/zeroInstall/stage15AndHazards.test.ts src/native/rustCpp/RustCppBinaryInspector.test.ts src/wasm/WabtArtifactProvider.test.ts
